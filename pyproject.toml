[build-system]
requires = ["setuptools>=77"] # need 77 or later for license string
build-backend = "setuptools.build_meta"

[project]
name = "pylon-analyzer"
version = "0.1.2"
description = "A static analysis CLI for Python scripts with various enhancements and an LLM layer"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ethan Gat" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["click", "python-dotenv", "requests"]

[project.optional-dependencies]
ollama = ["anthropic"]
openai = ["openai"]
anthropic = ["anthropic"]
google-genai = ["google-genai"]
llm-all = ["anthropic", "openai", "google-genai"]

[project.urls]
Homepage = "https://github.com/Anonymoose725/Pylon"

[project.scripts]
pylon = "pylon_analyzer.cli:check"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["testing"]