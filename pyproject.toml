[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "pylon-analyzer"
version = "0.1.0"
description = "A static analysis CLI for Python scripts with various enhancements and layers"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["click", "requests", "python-dotenv"]

[project.optional-dependencies]
# Ollama: local models, free, no API key required
ollama = ["anthropic"]  # anthropic also works for ollama (just points to local server)
# OpenAI provider
openai = ["openai"]
# Anthropic provider  
anthropic = ["anthropic"]
# Google provider
google-genai = ["google-genai"]
# All LLM providers
llm-all = ["anthropic", "openai", "google-genai"]

[project.scripts]
pylon = "cli:check"

[tool.setuptools]
packages = ["rules", "ai"]
py-modules = ["cli"]
